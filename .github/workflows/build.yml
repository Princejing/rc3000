name: Build OpenWrt for H3C RC3000

# 没有 Linux 机器时的最佳选择: 白嫖 GitHub 的 Ubuntu runner 编译。
# 用法: 把这个目录推到你的 GitHub 仓库，Actions 页面手动点 Run workflow。

on:
  workflow_dispatch:
    inputs:
      full:
        description: "同时产出写 NAND 的 factory 镜像"
        type: boolean
        default: false
      branch:
        description: "OpenWrt 分支"
        type: string
        default: "openwrt-25.12"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync \
            swig unzip zlib1g-dev file wget device-tree-compiler ccache

      - name: 缓存编译中间产物
        uses: actions/cache@v4
        with:
          path: build/openwrt-src
          key: openwrt-${{ github.event.inputs.branch }}-${{ github.sha }}
          restore-keys: openwrt-${{ github.event.inputs.branch }}-

      - name: 编译
        run: |
          chmod +x build/build.sh
          if [ "${{ github.event.inputs.full }}" = "true" ]; then
            build/build.sh --branch "${{ github.event.inputs.branch }}" --full
          else
            build/build.sh --branch "${{ github.event.inputs.branch }}"
          fi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: rc3000-openwrt
          path: output/*
          if-no-files-found: warn
          retention-days: 30
